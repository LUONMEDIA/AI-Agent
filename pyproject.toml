[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cms-batch-agent"
version = "0.1.0"
description = "Safety-gated CMS batch executor with dry-run, exact permissions and readback"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.48,<2"]

[project.scripts]
cms-batch = "cms_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
